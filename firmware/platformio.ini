[platformio]
default_envs = esp32s3_n16r8

[env:esp32s3_n16r8]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = partitions_aegis_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wextra
    -Werror
    -std=gnu++17
    -O2
lib_deps =
    pololu/VL53L1X@^1.3.1
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/Adafruit GFX Library@^1.11.9
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
upload_speed = 921600
monitor_speed = 921600

[env:esp32s3_bringup]
extends = env:esp32s3_n16r8
build_src_filter = -<main.cpp> +<../tools/bringup/01_i2c_scanner_voltage_check.cpp> +<sensors/> +<comms/serial_crc_bridge.cpp>

[env:native]
platform = native
test_framework = unity
build_flags =
    -DAEGIS_NATIVE_TEST=1
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -fsanitize=address,undefined
build_src_filter = -<main.cpp> +<ai/> +<mechatronics/> +<comms/serial_crc_bridge.cpp> +<sensors/>
