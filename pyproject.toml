[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ai"
version = "3.0.0"
description = "Ecossistema de Eletronica, Mecatronica, TinyML Bit-Exact & Sim-to-Real Vetorizado AEGIS-MECH S3"
authors = [{ name = "Equipe AEGIS" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "torch>=2.0.0",
    "opencv-python>=4.8.0",
    "pytest>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "optuna>=3.0.0",
    "rerun-sdk>=0.15.0",
    "pyserial>=3.5",
    "h5py>=3.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"
